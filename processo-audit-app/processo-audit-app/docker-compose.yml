version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: processo-audit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: processo_audit
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Node.js Backend
  backend:
    build: .
    container_name: processo-audit-backend
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: processo_audit
      PORT: 5000
      JWT_SECRET: sua_chave_secreta_super_segura_2024
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  # Frontend (opcional - geralmente rodado localmente)
  # frontend:
  #   image: node:18-alpine
  #   container_name: processo-audit-frontend
  #   working_dir: /app
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #   command: npm run dev

volumes:
  mysql_data:

networks:
  default:
    name: processo-audit-network
